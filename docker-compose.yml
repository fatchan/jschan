version: "3.5"
services:

  redis:
    command: redis-server --requirepass Mangoloco@2030
    image: redis:alpine

  mongodb:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=jschan
      - MONGO_INITDB_ROOT_PASSWORD=Mangoloco@2030

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
      args:
        ENABLED_MODULES: geoip
    ports:
      - "80:80"
    volumes:
      - ./docker/static/:/path/to/jschan/static/
    depends_on:
      - jschan

  jschan:
    build:
      context: .
      dockerfile: ./docker/jschan/Dockerfile
      network: default
    environment:
      - NODE_ENV=development
      - JSCHAN_IP=0.0.0.0
      - NO_CAPTCHA=1
      - MONGO_USERNAME=jschan
      - MONGO_PASSWORD=Mangoloco@2030
      - REDIS_PASSWORD=Mangoloco@2030
      - COOKIE_SECRET=9D9F5D251BB8AADAE88685545B8FE
      - TRIPCODE_SECRET=7f3c9a1d2e6b4f8a9c0d3e7f1a2b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
      - IP_HASH_SECRET=1a9e8b7c6d5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9
      - POST_PASSWORD_SECRET=9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8
    volumes:
      - ./docker/static:/opt/static/
    depends_on:
      - redis
      - mongodb

  jschan-reset:
    build:
      context: .
      dockerfile: ./docker/jschan/Dockerfile-reset
      network: default
    environment:
      - MONGO_USERNAME=jschan
      - MONGO_PASSWORD=Mangoloco@2030
      - REDIS_PASSWORD=Mangoloco@2030
    volumes:
      - ./docker/static:/opt/static/
    depends_on:
      - redis
      - mongodb

networks:
  default:
    external: true
    name: baldurs_gate
